name: Update star history

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install matplotlib==3.11.1

      - name: Generate charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python source/scripts/update_star_history.py --output-dir generated

      - name: Validate charts
        run: >-
          python source/scripts/check_screenshots.py
          generated/star-history-light.png
          generated/star-history-dark.png

      - name: Upload validated charts
        uses: actions/upload-artifact@v4
        with:
          name: star-history-charts
          path: generated/star-history-*.png
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out chart assets
        uses: actions/checkout@v4
        with:
          ref: star-history-assets
          path: assets

      - name: Download validated charts
        uses: actions/download-artifact@v4
        with:
          name: star-history-charts
          path: assets

      - name: Publish changed charts
        working-directory: assets
        run: |
          git add star-history-light.png star-history-dark.png
          if git diff --cached --quiet -- star-history-light.png star-history-dark.png; then
            echo "Star history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update star history charts"
          git push
